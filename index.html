!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards Interativos</title>
<style>
/* Configurações Gerais */
body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background-color: #f0f2f5;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
margin: 0;
gap: 20px;
flex-wrap: wrap;
}

/* Container do Flashcard */
.flashcard {
background-color: transparent;
width: 300px;
height: 200px;
perspective: 1000px; /* Efeito 3D */
cursor: pointer;
}

/* Corpo Interno que vai girar */
.flashcard-inner {
position: relative;
width: 100%;
height: 100%;
text-align: center;
transition: transform 0.6s;
transform-style: preserve-3d;
border-radius: 15px;
box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}

/* Evento de clique controlado por JavaScript */
.flashcard.flipped .flashcard-inner {
transform: rotateY(180deg);
}

/* Estilo comum para as duas faces */
.flashcard-front, .flashcard-back {
position: absolute;
width: 100%;
height: 100%;
-webkit-backface-visibility: hidden; /* Esconde a face oposta */
backface-visibility: hidden;
display: flex;
align-items: center;
justify-content: center;
font-size: 20px;
font-weight: bold;
padding: 20px;
box-sizing: border-box;
border-radius: 15px;
transition: background-color 0.3s ease;
}

/* Face da Frente (Pergunta) */
.flashcard-front {
background-color: #3498db;
color: white;
}

/* Hover na Frente */
.flashcard:hover .flashcard-front {
background-color: #2980b9;
}

/* Face de Trás (Resposta) */
.flashcard-back {
background-color: #2ecc71;
color: white;
transform: rotateY(180deg);
}

/* Hover Atrás */
.flashcard:hover .flashcard-back {
background-color: #27ae60;
}
</style>
</head>
<body>

<!-- Flashcard 1 -->
<div class="flashcard" onclick="flipCard(this)">
<div class="flashcard-inner">
<div class="flashcard-front">
a luz emite sua propria luz
</div>
<div class="flashcard-back">
falso
</div>
</div>
</div>

<!-- Flashcard 2 -->
<div class="flashcard" onclick="flipCard(this)">
<div class="flashcard-inner">
<div class="flashcard-front">
 Sistema Braille é a única forma que as pessoas cegas têm para ler livros e textos.
</div>
<div class="flashcard-back">
Falso. 
</div>
</div>
</div>

<script>
// Função simples para girar o card adicionando uma classe CSS
function flipCard(card) {
card.classList.toggle('flipped');
}
</script>

</body>
</html>
